# Fork-dLLM: MATH-12K training / all 500 MATH-500 validation problems.
# Set MATH12K_DATA_DIR to prepared train.jsonl / test.jsonl with problem/answer.
# Inherits three fallback replay views, 16 denoising steps, and 2+2 node split.
defaults: ./fork_grpo-deepscaler-3b-4n8g-megatron-vllm-async-long.yaml

grpo:
  max_val_samples: 500
  val_batch_size: 100
  val_num_generations_per_prompt: 1

policy:
  max_total_sequence_length: 6144
  generation:
    vllm_cfg:
      max_model_len: 6208

data:
  _override_: true
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: false
  max_input_seq_length: 2048
  train:
    dataset_name: ResponseDataset
    data_path: ${oc.env:MATH12K_DATA_DIR}/train.jsonl
    input_key: problem
    output_key: answer
  validation:
    dataset_name: ResponseDataset
    data_path: ${oc.env:MATH12K_DATA_DIR}/test.jsonl
    input_key: problem
    output_key: answer
  default:
    prompt_file: examples/prompts/cot.txt
    system_prompt_file: null
    processor: math_hf_data_processor
    env_name: math

checkpointing:
  enabled: true
  checkpoint_dir: ${oc.env:CHECKPOINT_ROOT,${logger.log_dir}/checkpoints}
  save_period: 10
  keep_top_k: 2
  checkpoint_must_save_by: "00:03:30:00"

logger:
  log_dir: ${oc.env:LOG_DIR,results/fork_grpo_math12k_3b}
  wandb:
    name: ${oc.env:WANDB_RUN_NAME,fork_grpo_math12k_3b}
