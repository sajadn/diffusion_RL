[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fork-grpo"
version = "0.1.0"
description = "ForkGRPO fallback-only diffusion training on NeMo RL"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = ["block-diffusion", "just-grpo", "nemo-rl", "trace-grpo"]

[dependency-groups]
test = ["pytest>=7.0.0"]

[tool.uv.sources]
block-diffusion = { workspace = true }
just-grpo = { workspace = true }
nemo-rl = { workspace = true }
trace-grpo = { workspace = true }

[tool.hatch.build]
exclude = ["**/*.swp", "**/*.swo"]

[tool.hatch.build.targets.wheel]
packages = ["fork_grpo"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["../trace_grpo", "../just_grpo", "../just_grpo/tests/unit", "../block_diffusion/tests/unit"]
