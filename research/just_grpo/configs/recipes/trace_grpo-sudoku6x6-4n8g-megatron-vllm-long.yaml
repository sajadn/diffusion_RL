defaults: ./trace_grpo-sudoku6x6-4n8g-megatron-inference-long.yaml
trace_grpo:
  runtime: reference_vllm
policy:
  generation:
    backend: vllm
    refit_transport: null
    worker_extension_cls_fqn: just_grpo.generation.reference_vllm.ReferenceVllmWorker
    vllm_cfg:
      async_engine: false
    vllm_kwargs:
      diffusion_config:
        canvas_length: ${trace_grpo.sampling.block_size}
        max_denoising_steps: ${trace_grpo.sampling.max_steps}
        temperature: ${trace_grpo.sampling.temperature}
        selection_policy: ${trace_grpo.sampling.selection_policy}
        confidence_threshold: ${trace_grpo.sampling.threshold}
        return_entropy: ${trace_grpo.sampling.returns_entropy}
        return_reveal_steps: ${trace_grpo.sampling.returns_reveal_steps}
        emit_full_blocks: ${trace_grpo.sampling.emit_full_blocks}
logger:
  log_dir: results/trace_grpo_sudoku6x6_vllm
  wandb:
    name: ${oc.env:WANDB_RUN_NAME,trace_grpo_sudoku6x6_vllm}
