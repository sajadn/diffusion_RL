# Shared controls: AR/Block rollouts T=1; both validation modes T=1.
# Trace leaves explicitly override rollout temperature to 0.6.
# Fragment: append after the algorithm and task parents.
defaults: nemotron_labs_diffusion_3b_vllm_generation_common.yaml
grpo:
  num_prompts_per_step: 128
  num_generations_per_prompt: 8
  max_num_steps: 100
  max_num_epochs: 1000
  seed: 42
  normalize_rewards: false
  skip_reference_policy_logprobs_calculation: false
  val_at_start: true
  val_at_end: true
  val_period: 10
  async_grpo:
    enabled: false
loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: k3
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2.0
  truncated_importance_sampling_ratio_min: null
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
policy:
  train_global_batch_size: 1024
  hf_config_overrides:
    block_size: 16
  megatron_cfg:
    optimizer:
      lr: 3.0e-7
    scheduler:
      lr_decay_style: constant
      lr_warmup_iters: 13
  generation:
    temperature: 1.0
    top_p: 1.0
    top_k: null
    colocated:
      enabled: true
    sglang_val_dllm_overrides: null
    vllm_cfg:
      async_engine: false
    vllm_val_dllm_overrides: null
    # Dedicated groups pin engine architecture as well as every decode knob.
    # Both evaluate the current weights at each validation/save interval.
    vllm_val_dllm_variants:
      diffusion_conf09:
        temperature: 1.0
        vllm_cfg:
          gpu_memory_utilization: 0.55
        vllm_kwargs:
          hf_overrides:
            architectures: [NemotronLabsDiffusionModel]
            block_size: 16
          diffusion_config:
            canvas_length: 16
            max_denoising_steps: 16
            selection_policy: confidence_threshold
            confidence_threshold: 0.9
            temperature: 1.0
            emit_full_blocks: false
            return_reveal_steps: false
            return_entropy: false
      ar:
        temperature: 1.0
        vllm_cfg:
          gpu_memory_utilization: 0.55
        vllm_kwargs:
          hf_overrides:
            architectures: [NemotronLabsDiffusionForCausalLM]
            block_size: 16
          diffusion_config: null
checkpointing:
  enabled: true
  save_period: 10
  keep_top_k: 2
cluster:
  num_nodes: 4
  gpus_per_node: 8
