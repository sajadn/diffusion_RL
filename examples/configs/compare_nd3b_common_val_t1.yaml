# Comparison overrides; algorithm/task parents supply training defaults.
# Both validation modes use T=1; Trace children set entropy-k2 rollouts to T=0.6.
defaults: nemotron_labs_diffusion_3b_vllm_generation_common.yaml
grpo:
  # Let Slurm allocation time bound continuation legs.
  max_num_steps: 1000000
  normalize_rewards: false
  skip_reference_policy_logprobs_calculation: false
  val_at_start: true
loss_fn:
  reference_policy_kl_penalty: 0.01
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2.0
policy:
  hf_config_overrides:
    block_size: 16
  megatron_cfg:
    scheduler:
      # Accept the longer schedule when restoring the original optimizer state.
      override_opt_param_scheduler: true
      use_checkpoint_opt_param_scheduler: false
  generation:
    sglang_val_dllm_overrides: null
    vllm_val_dllm_overrides: null
    # Dedicated engine groups pin both architecture and validation decoding.
    vllm_val_dllm_variants:
      diffusion_conf09:
        temperature: 1.0
        vllm_cfg:
          gpu_memory_utilization: 0.55
        vllm_kwargs:
          hf_overrides:
            architectures:
            - NemotronLabsDiffusionModel
            block_size: 16
          diffusion_config:
            canvas_length: 16
            max_denoising_steps: 16
            selection_policy: confidence_threshold
            confidence_threshold: 0.9
            temperature: 1.0
            emit_full_blocks: false
            return_reveal_steps: false
            return_entropy: false
      ar:
        temperature: 1.0
        vllm_cfg:
          gpu_memory_utilization: 0.55
        vllm_kwargs:
          hf_overrides:
            architectures:
            - NemotronLabsDiffusionForCausalLM
            block_size: 16
          diffusion_config: null
cluster:
  num_nodes: 4
