# sudoku6x6, block_justgrpo: rollout T=1.0; AR and confidence-0.9 validation T=1.
defaults:
  - grpo_sudoku6x6_block_just_grpo_vllm.yaml
  - compare_nd3b_common_val_t1.yaml
policy:
  train_micro_batch_size: 4
  logprob_batch_size: 4
  generation:
    vllm_kwargs:
      hf_overrides:
        architectures: [NemotronLabsDiffusionModel]
      diffusion_config:
        max_denoising_steps: 16
        emit_full_blocks: false
        return_reveal_steps: false
        return_entropy: false
grpo:
  val_batch_size: 128
  max_val_samples: 1024
checkpointing:
  checkpoint_dir: results/compare_nd3b_sudoku6x6_block_justgrpo_val_t1
logger:
  log_dir: logs/compare_nd3b_sudoku6x6_block_justgrpo_val_t1
  wandb:
    name: compare_nd3b_sudoku6x6_block_justgrpo_val_t1
