# Entropy-selected positions, categorical tokens; same signed Trace objective.
# AGRPO-matched MATH train / held-out MATH-500 validation, 8 train + 2 gen nodes.
defaults: "math500_nemotron_labs_diffusion_3b_vllm_trace_grpo_math_agrpo_8t2g.yaml"

grpo:
  max_num_steps: 300
  val_at_start: true

policy:
  generation:
    temperature: 1.0
    vllm_kwargs:
      diffusion_config:
        selection_policy: "entropy"
        temperature: 1.0
        confidence_threshold: null
        canvas_length: 16
        max_denoising_steps: 8
    vllm_val_dllm_overrides:
      vllm_kwargs:
        diffusion_config:
          # Validation threshold mode needs up to one reveal per step.
          max_denoising_steps: 16


checkpointing:
  checkpoint_dir: "results/math_agrpo_trace_entropy_top2_t1_8t2g_20260910"
logger:
  log_dir: "logs/math_agrpo_trace_entropy_top2_t1_8t2g_20260910"
  wandb:
    name: "math_agrpo_trace_entropy_top2_t1_8t2g_20260910"
