# ns_tools production run at lr 1e-6 (3.3x the inherited 3e-7), from scratch.
#
# WHY: 3e-7 is very conservative for an 8B GRPO run (typical 1e-6 - 5e-6). It was
# the right setting while the advantage-grouping bug (fixed in 76a7df39b) left
# ~99% of every batch at zero advantage -- there was nothing to amplify. With the
# fix, ~33% of groups carry gradient, so the learning rate became the binding
# constraint: 40 steps at 3e-7 produced no movement beyond noise.
#
# Sizing: detecting a +2 point solve-rate change needs ~34 steps per the measured
# per-step noise (SD 0.029, ~3.5x binomial because each step draws 120 of 6972
# prompts). At 3e-7 the true effect may sit below that threshold indefinitely.
#
# RISK, watch closely: reference_policy_kl_penalty is 0.0, so there is NO KL anchor
# to the reference policy -- only ratio_clip 0.2 limits per-step drift. A higher lr
# with no KL term can run away. This repo has a documented length-collapse failure
# (mcqa_rg: p50 response 308 -> 12 tokens, zero-adv groups 38% -> 69%). Watch mean
# and p10 response length and the mixed-group fraction; revert on any sustained fall.
#
# Everything else inherited unchanged: 8t8g, 120 x 16 = 1920, 5-turn agent cap,
# dual AR/diffusion validation, vLLM metrics logger, 300 steps.
defaults: "ar_v30_ns_prod_8t8g.yaml"

policy:
  megatron_cfg:
    optimizer:
      lr: 1.0e-6      # was 3.0e-7
      min_lr: 1.0e-7  # was 3.0e-8 (same 10:1 floor ratio)
