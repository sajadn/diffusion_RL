# SMALL ns_tools multi-turn toy: 16 concurrent rollouts instead of 128.
#
# WHY SMALL: run 18156660 (all format fixes + 8k tokens) wedged with GPUs at 0% and
# 5/8 trajectory groups complete. The cause was NOT format and NOT truncation
# (0 "Unterminated string", 0 HTTP 500, 0 tracebacks). It was the SANDBOX:
#   (NemoGym pid=...) [worker unknown] INFO: active_sessions=253   <- flat, not growing
# nemo_skills' local_sandbox_server is a single-process Flask `app.run(port=6000)`
# (its WORKER_NUM env var implies a multi-worker deployment the package does not ship).
# 128 concurrent rollouts, each opening a persistent IPython session that is never
# deleted, saturate it; tool calls stop returning and generation goes idle.
#
# 8 x 16 = 128 rollouts -> 4 x 4 = 16. Enough to answer "does the loop close?" while
# keeping the sandbox within what one process can serve.
#
# PASS: samples with >=2 trainable segments in token_loss_mask AND a tool_response
#       containing REAL output rather than an {"error": ...} echo.
defaults: "ar_v30_ns_refreshed.yaml"

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4
  max_num_steps: 2

policy:
  train_global_batch_size: 16

logger:
  log_dir: "logs/ar-v30-ns-esys-small"
  wandb:
    project: "diffusion_rl"
    name: "ar_v30_ns_esys_small"
